name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonpath "$(command -v python)"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: Exercise experiment CLI
        run: |
          text-factors evaluate --seeds 7 --points 8 --epochs 3 --train-size 8 --dev-size 16 --test-size 16 --noise-size 16 --bootstrap-resamples 20 --output artifacts/evaluation-smoke.json
          text-factors microworld --seed 7 --episodes 4 --output artifacts/microworld-smoke.json
