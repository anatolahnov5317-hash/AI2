name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonpath "$(command -v python)"
      - name: Run all tests in bounded batches
        timeout-minutes: 11
        run: timeout 600s python scripts/run_test_batches.py --output artifacts/test-batches --timeout 180
      - run: python -m compileall -q src tests
      - name: Exercise experiment CLI
        run: |
          text-factors evaluate --seeds 7 --points 8 --epochs 3 --train-size 8 --dev-size 16 --test-size 16 --noise-size 16 --bootstrap-resamples 20 --output artifacts/evaluation-smoke.json
          text-factors microworld --seed 7 --episodes 4 --output artifacts/microworld-smoke.json
          text-factors factor-recovery --seeds 7 --points 8 --train-samples 32 --test-samples 16 --output artifacts/factor-smoke.json
          text-factors context-transfer --seeds 7 --points 16 --epochs 1 --train-size 8 --dev-size 4 --test-size 4 --seconds-per-seed 30 --output artifacts/context-smoke.json
          text-factors experience-demo --seed 7 --output artifacts/experience-smoke.json
          text-factors transform-learning --seeds 7 --points 32 --epochs 1 --seconds 30 --output artifacts/transform-learning-smoke.json
          text-factors dialogue-demo --seed 7 --output artifacts/dialogue-smoke.json
          text-factors coactivation-structure --seconds 30 --output artifacts/coactivation-structure-smoke.json
          text-factors context-integration --seeds 11 --points 32 --epochs 1 --seconds 60 --output artifacts/context-integration-smoke.json
          text-factors scene-integration --seeds 59 --points 32 --epochs 1 --seconds 90 --output artifacts/scene-integration-smoke.json
      - name: Exercise supervised grounded dialogue
        timeout-minutes: 3
        run: |
          timeout 45s text-factors converse --demo --state artifacts/grounded-chat.json
          timeout 35s text-factors dialogue-evaluate --split development --seeds 42 --modes factor oracle --seconds 25 --output artifacts/grounded-dialogue-smoke.json
      - name: Exercise learned dialogue checkpoints and development evaluation
        timeout-minutes: 3
        run: |
          timeout 100s text-factors learned-train --seconds 80 --output artifacts/learned-model.json
          timeout 45s text-factors learned-chat --model artifacts/learned-model.json --state artifacts/learned-state.json --message "Петя передал книгу Маше" --message "У кого книга?"
          timeout 35s text-factors learned-evaluate --model artifacts/learned-model.json --split development --seconds 25 --output artifacts/learned-development.json
