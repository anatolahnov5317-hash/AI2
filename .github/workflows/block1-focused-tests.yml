name: Block 1 Focused Tests

on:
  push:
    branches:
      - test/block1-quality-gate
    paths:
      - ".github/workflows/block1-focused-tests.yml"
      - "src/text_factors/observations/**"
      - "tests/test_block1_quality_gate.py"
      - "tests/test_observation_learning.py"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run focused Block-1 tests verbosely
        run: |
          python -m unittest -v \
            tests.test_block1_quality_gate \
            tests.test_observation_learning
